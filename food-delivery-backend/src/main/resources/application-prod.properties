# ==============================================================================
# Production Profile Configuration (Active)
# Host IP: 194.242.57.93
# ==============================================================================

# Server Port Configuration
server.port=${SERVER_PORT:8082}

# ==============================================================================
# Database Configuration (PostgreSQL on Port 5002)
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://194.242.57.93:5002/fooddelivery02}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================================
# Monitoring & Metrics Configuration (Spring Boot Actuator & Prometheus)
# Scraped by Prometheus / Visualized in Grafana
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.export.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=food-delivery-backend
management.metrics.tags.environment=prod

# ==============================================================================
# Logging & Loki Configuration (Log Aggregation for Grafana Loki)
# ==============================================================================
loki.url=${LOKI_URL:http://194.242.57.93:3100/loki/api/v1/push}
logging.level.root=INFO
logging.level.com.ait=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# ==============================================================================
# Mailer Configuration (JavaMailSender / Portmailer)
# ==============================================================================
spring.mail.host=${MAIL_HOST:194.242.57.93}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
