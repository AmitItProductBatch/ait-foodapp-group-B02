# ==============================================================================
# Service Identification & Port
# ==============================================================================
spring.application.name=fooddelivery-backend02
server.port=8082

# ==============================================================================
# PostgreSQL Database Configuration
# ==============================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres-db}:${DB_PORT:5432}/${DB_NAME:fooddelivery02}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================================
# Observability & Monitoring: Grafana & Prometheus
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=prod
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Exclude mail indicator from marking service DOWN
management.health.mail.enabled=false

# ==============================================================================
# Logging & Loki Integration
# ==============================================================================
logging.level.root=INFO
logging.level.com.ait=DEBUG
logging.level.org.springframework.web=INFO
loki.url=${LOKI_URL:http://loki:3100/loki/api/v1/push}

# ==============================================================================
# Mailpit SMTP Configuration
# ==============================================================================
spring.mail.host=${MAIL_HOST:mailpit}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
ors.api.key=${ORS_API_KEY:default_key}

