version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: fooddelivery-postgres02
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fooddelivery02}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5002}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fooddelivery02}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fooddelivery-network

  backend:
    build:
      context: ./food-delivery-backend
      dockerfile: Dockerfile
    container_name: fooddelivery-backend02
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8082}:8082"
    labels:
      metrics.scrape: "true"
      metrics.path: "/actuator/prometheus"
      metrics.port: "8082"
      app.name: "fooddelivery-backend02"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB:-fooddelivery02}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      LOKI_URL: ${LOKI_URL:-http://loki:3100/loki/api/v1/push}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: 1025
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - fooddelivery-network
      - monitoring

  frontend:
    build:
      context: ./food-delivery-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://194.242.57.93:8082/api/users}
    container_name: fooddelivery-frontend02
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4002}:80"
    depends_on:
      - backend
    networks:
      - fooddelivery-network

volumes:
  postgres_data:
    name: fooddelivery_postgres_data02

networks:
  fooddelivery-network:
    name: fooddelivery-network02
    driver: bridge
  monitoring:
    external: true
